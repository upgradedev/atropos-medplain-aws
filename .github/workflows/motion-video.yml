name: MedPlain Cinematic Motion Pitch

on:
  push:
    branches:
      - codex/medplain-motion-lead-20261102
      - codex/medplain-motion-render-20261102
    paths:
      - video/motion-render-request.json
      - scripts/motion_graphics.py
      - scripts/motion_video.py
      - scripts/check_motion_video_source.py
      - scripts/prepare_motion_video_request.py
      - .github/workflows/motion-video.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Must match the independently reviewed committed request
        type: choice
        options: [prototype, full]
        required: true
      source_tag:
        description: Reviewed full-input release tag; empty for visual prototype
        type: string
      source_archive_sha256:
        description: Reviewed full-input ZIP digest; empty for prototype
        type: string
      source_manifest_sha256:
        description: Reviewed full-input manifest digest; empty for prototype
        type: string

permissions:
  contents: read

jobs:
  cinematic-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOTION_MODE: ${{ inputs.mode }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_ARCHIVE_SHA: ${{ inputs.source_archive_sha256 }}
      SOURCE_MANIFEST_SHA: ${{ inputs.source_manifest_sha256 }}
      GH_TOKEN: ${{ github.token }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dependency-free source and motion controls
        run: python -B scripts/check_motion_video_source.py
      - name: Require exact independent code and input review bindings
        id: request
        run: python -B scripts/prepare_motion_video_request.py
      - name: Install pinned motion tools in CI only
        if: steps.request.outputs.render == 'true'
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir Pillow==13.0.0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version
          python -c 'import PIL; assert PIL.__version__ == "13.0.0"; print(PIL.__version__)'
      - name: Render an early eight-second visual design prototype
        if: steps.request.outputs.render == 'true'
        run: python -B scripts/motion_video.py prototype --output artifacts/motion-opening
      - name: Make the bounded opening preview available before the full movie
        if: steps.request.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: medplain-motion-opening-${{ github.sha }}
          path: artifacts/motion-opening/
          retention-days: 14
      - name: Read only the root-reviewed full motion source
        if: steps.request.outputs.render == 'true' && env.MOTION_MODE == 'full'
        run: |
          mkdir -p artifacts/input-download
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern medplain-motion-source.zip --dir artifacts/input-download
          python -B scripts/pitch_video.py unpack --archive artifacts/input-download/medplain-motion-source.zip --sha256 "$SOURCE_ARCHIVE_SHA" --output artifacts/motion-inputs
      - name: Require anonymous HTTP200 and exact frozen application source
        if: steps.request.outputs.render == 'true' && env.MOTION_MODE == 'full'
        run: python -B scripts/check_demo_video_live.py --output artifacts/readiness/motion-live-source.json
      - name: Stream the reviewed continuous motion pitch without a PNG sequence
        if: steps.request.outputs.render == 'true' && env.MOTION_MODE == 'full'
        run: python -B scripts/motion_video.py render --inputs artifacts/motion-inputs --manifest-sha256 "$SOURCE_MANIFEST_SHA" --output artifacts/motion-render
      - name: Retain complete sources, raw reports, motion proof and failed partials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medplain-cinematic-motion-${{ github.sha }}
          path: |
            artifacts/motion-opening/
            artifacts/input-download/
            artifacts/motion-inputs/
            artifacts/motion-render/
            artifacts/readiness/
          if-no-files-found: warn
          retention-days: 14
