name: MedPlain CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      judge_url:
        description: 'Public AWS URL to verify after deployment'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: medplain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MEDPLAIN_MODEL_MODE: fixture
      MEDPLAIN_COMMIT: ${{ github.sha }}
      AWS_EC2_METADATA_DISABLED: 'true'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked source for secrets and prohibited punctuation
        run: python scripts/check_source.py
      - name: Check console source formatting
        id: console_format
        run: npx --yes prettier@3.5.3 --check 'web/**/*.{ts,tsx,css,js,cjs,json,html}'
      - name: Prepare formatting repair after a failed check
        if: ${{ failure() && steps.console_format.outcome == 'failure' }}
        run: npx --yes prettier@3.5.3 --write 'web/**/*.{ts,tsx,css,js,cjs,json,html}'
      - name: Publish formatting repair after a failed check
        if: ${{ failure() && steps.console_format.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: console-format-repair-${{ github.sha }}
          path: web/
          retention-days: 2
      - name: Publish formatted console sources
        uses: actions/upload-artifact@v4
        with:
          name: console-formatted-${{ github.sha }}
          path: web/
          retention-days: 5
      - name: Install and build the React console in CI
        run: |
          if [ ! -f web/package-lock.json ]; then
            npm install --prefix web --package-lock-only --ignore-scripts
          fi
          npm ci --prefix web
          npm run build --prefix web
          mkdir -p artifacts
          cp web/package-lock.json artifacts/frontend-package-lock.json
          python scripts/stage_console.py
          python scripts/check_source.py
      - name: Install CI-only dependencies
        run: python -m pip install '.[test]' build playwright
      - name: Prepare and validate offline Strands demonstration collection
        run: |
          PYTHONPATH=src python scripts/build_prepared_demo.py --output src/medplain/data/prepared_demo.json --source-commit "$GITHUB_SHA"
          python scripts/check_source.py
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit and integration tests without network
        run: python scripts/offline_tests.py -q --junitxml=artifacts/tests.xml --cov=medplain --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml
      - name: Verify infrastructure ownership and recursive frontend packaging
        run: python scripts/test_delivery_v2.py
      - name: Build standalone wheel
        run: |
          python -m build --wheel
          python scripts/stage_console.py --verify-archive dist/*.whl
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Install browser in CI only
        run: python -m playwright install --with-deps chromium
      - name: Execute anonymous desktop and 375px journeys
        run: python scripts/browser_smoke.py --output artifacts/browser
      - name: Execute console case, review, maps and mobile journeys
        run: python scripts/console_browser_smoke.py --output artifacts/console-browser
      - name: Prepare Linux Lambda dependencies
        run: python -m pip install . --target "$RUNNER_TEMP/medplain-runtime" --no-compile
      - name: Assemble Lambda package and SHA-256 manifest
        run: |
          python scripts/package_lambda.py --dependency-dir "$RUNNER_TEMP/medplain-runtime" --commit "$GITHUB_SHA" --require-console --require-prepared-demo
          python scripts/stage_console.py --verify-archive artifacts/medplain-lambda.zip
      - name: Require a live 200 and execute the flagship claim
        if: ${{ inputs.judge_url != '' }}
        env:
          JUDGE_URL: ${{ inputs.judge_url }}
        run: python scripts/live_smoke.py "$JUDGE_URL" --expected-commit "$GITHUB_SHA"
      - name: Verify deployed anonymous desktop and 375px journeys
        if: ${{ inputs.judge_url != '' }}
        env:
          JUDGE_URL: ${{ inputs.judge_url }}
        run: python scripts/browser_smoke.py --url "$JUDGE_URL" --output artifacts/live-browser
      - name: Verify the deployed durable case and review workflow
        if: ${{ inputs.judge_url != '' }}
        env:
          JUDGE_URL: ${{ inputs.judge_url }}
        run: python scripts/ops_live_smoke.py "$JUDGE_URL" --expected-commit "$GITHUB_SHA" --output artifacts/live-ops.json
      - name: Verify deployed console desktop and mobile journeys
        if: ${{ inputs.judge_url != '' }}
        env:
          JUDGE_URL: ${{ inputs.judge_url }}
        run: python scripts/console_browser_smoke.py --url "$JUDGE_URL" --output artifacts/live-console-browser
      - name: Publish build and test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medplain-${{ github.sha }}
          path: |
            artifacts/
            dist/*.whl
          retention-days: 10
          if-no-files-found: error
