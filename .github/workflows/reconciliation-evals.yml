name: MedPlain Complex Discharge Evals

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [fixture, bedrock]
        default: fixture
      judge_url:
        type: string
        default: https://gioep6m26pm3cwvxjp4z4erpmu0zihbk.lambda-url.us-east-1.on.aws
      expected_commit:
        type: string
        description: Exact deployed source, required in Bedrock mode
      corpus_sha256:
        type: string
        description: Frozen reconciliation corpus hash from the source CI report

permissions:
  contents: read

jobs:
  complex-paired-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MEDPLAIN_MODEL_MODE: fixture
      MEDPLAIN_COMMIT: ${{ github.sha }}
      AWS_EC2_METADATA_DISABLED: 'true'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate explicit source and corpus before any live work
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bedrock'
        env:
          JUDGE_URL: ${{ inputs.judge_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CORPUS_SHA256: ${{ inputs.corpus_sha256 }}
          HARNESS_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,re
          assert os.environ['JUDGE_URL'].rstrip('/') == 'https://gioep6m26pm3cwvxjp4z4erpmu0zihbk.lambda-url.us-east-1.on.aws'
          assert re.fullmatch('[0-9a-f]{40}',os.environ['EXPECTED_COMMIT'])
          assert os.environ['HARNESS_COMMIT'] == os.environ['EXPECTED_COMMIT']
          assert re.fullmatch('[0-9a-f]{64}',os.environ['CORPUS_SHA256'])
          PY
      - name: Install official optional Evals dependencies in CI only
        run: python -m pip install --no-cache-dir -e '.[test,eval]'
      - name: Complete offline instrument and independent negative proofs
        run: |
          python scripts/evaluate_reconciliation.py --mode fixture --source-commit "$GITHUB_SHA" --output artifacts/reconciliation-fixture.json
          python scripts/offline_tests.py tests/test_reconciliation_evaluation.py -q --junitxml=artifacts/reconciliation-evaluation-tests.xml
      - name: Measure thirty actual source-bound Bedrock cases without POST retries
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bedrock'
        env:
          JUDGE_URL: ${{ inputs.judge_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CORPUS_SHA256: ${{ inputs.corpus_sha256 }}
        run: python scripts/evaluate_reconciliation.py --mode bedrock --judge-url "$JUDGE_URL" --source-commit "$EXPECTED_COMMIT" --corpus-sha256 "$CORPUS_SHA256" --output artifacts/reconciliation-bedrock.json
      - name: Publish raw reports, partial journals and tests including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-evaluation-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
