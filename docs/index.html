<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Atropos MedPlain · Demo 2:48</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#0c131b; color:#edf4f8; }
    * { box-sizing:border-box; }
    body { margin:0; padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
    main { max-width:1000px; margin:0 auto; }
    .brand { color:#82e1c5; font-size:.8rem; font-weight:750; letter-spacing:.12em; }
    h1 { margin:10px 0; font-size:clamp(1.7rem,5vw,2.5rem); line-height:1.15; }
    p { line-height:1.6; color:#b2c2d1; }
    video { width:100%; aspect-ratio:16/9; display:block; background:#000; border:1px solid #334353; border-radius:12px; }
    .controls { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin:16px 0 6px; }
    button { min-height:48px; padding:12px 20px; border:1px solid #435565; border-radius:9px; font:inherit; font-weight:700; color:inherit; background:#1a2735; cursor:pointer; }
    #play { background:#82e1c5; border-color:#82e1c5; color:#102924; }
    button:focus-visible,a:focus-visible { outline:3px solid #fff; outline-offset:4px; }
    output { font-variant-numeric:tabular-nums; color:#b2c2d1; }
    a { color:#82e1c5; text-underline-offset:3px; overflow-wrap:anywhere; }
    footer { margin-top:24px; border-top:1px solid #334353; padding-top:16px; font-size:.85rem; }
    #error { color:#ffd1b7; border-left:3px solid #ffd1b7; padding-left:12px; }
    [hidden] { display:none!important; }
    @media(max-width:420px) { body { padding-top:20px; } button { flex:1 1 auto; padding-inline:14px; } output { flex-basis:100%; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">ATROPOS MEDPLAIN</div>
    <h1>Δες το demo</h1>
    <p>Πάτησε Αναπαραγωγή. Διάρκεια 2 λεπτά και 48 δευτερόλεπτα.</p>
    <video id="video" controls playsinline preload="metadata" poster="poster.png" aria-label="Atropos MedPlain demo, 2 λεπτά και 48 δευτερόλεπτα">
      <source src="medplain-demo.mp4" type="video/mp4">
      Ο browser δεν υποστηρίζει αυτό το βίντεο. <a href="medplain-demo.mp4">Άνοιγμα του MP4</a>.
    </video>
    <div class="controls" id="controls" hidden>
      <button id="play" type="button" aria-controls="video">Αναπαραγωγή</button>
      <button id="sound" type="button" aria-controls="video" aria-pressed="false">Σίγαση</button>
      <output id="time" aria-label="Χρόνος βίντεο">00:00 / 02:48</output>
    </div>
    <p id="status" role="status">Χρησιμοποίησε το κουμπί αναπαραγωγής του βίντεο.</p>
    <p id="error" role="alert" hidden></p>
    <noscript><p>Πάτησε το Play μέσα στο βίντεο.</p></noscript>
    <footer>
      <p>Έκδοση για έλεγχο. Συνθετικά δεδομένα. Λήψεις οθόνης με αφήγηση.</p>
      <p><a href="medplain-demo.mp4" download>Λήψη MP4</a> · <a href="https://github.com/upgradedev/atropos-medplain-aws/releases/tag/medplain-demo-video-20261102">Πηγές και captions</a></p>
    </footer>
  </main>
  <script>
    const video = document.getElementById('video');
    const play = document.getElementById('play');
    const sound = document.getElementById('sound');
    const status = document.getElementById('status');
    const error = document.getElementById('error');
    const clock = seconds => {
      const value = Number.isFinite(seconds) ? Math.max(0, Math.floor(seconds)) : 0;
      return String(Math.floor(value / 60)).padStart(2, '0') + ':' + String(value % 60).padStart(2, '0');
    };
    const updateTime = () => {
      document.getElementById('time').textContent = clock(video.currentTime) + ' / ' + clock(video.duration);
    };
    play.addEventListener('click', async () => {
      error.hidden = true;
      if (!video.paused) { video.pause(); return; }
      try { await video.play(); }
      catch (_) {
        error.textContent = 'Η αναπαραγωγή δεν ξεκίνησε. Δοκίμασε το Play μέσα στο βίντεο ή ανανέωσε τη σελίδα.';
        error.hidden = false;
      }
    });
    sound.addEventListener('click', () => { video.muted = !video.muted; });
    video.addEventListener('volumechange', () => {
      sound.textContent = video.muted ? 'Ενεργοποίηση ήχου' : 'Σίγαση';
      sound.setAttribute('aria-pressed', String(video.muted));
    });
    video.addEventListener('playing', () => {
      play.textContent = 'Παύση'; status.textContent = 'Το βίντεο παίζει.';
    });
    video.addEventListener('pause', () => {
      play.textContent = 'Αναπαραγωγή'; status.textContent = 'Σε παύση.';
    });
    video.addEventListener('ended', () => {
      play.textContent = 'Αναπαραγωγή'; status.textContent = 'Το βίντεο ολοκληρώθηκε.';
    });
    video.addEventListener('error', () => {
      error.textContent = 'Το βίντεο δεν φορτώθηκε. Ανανέωσε τη σελίδα ή επίλεξε Λήψη MP4.';
      error.hidden = false;
    });
    video.addEventListener('timeupdate', updateTime);
    video.addEventListener('loadedmetadata', updateTime);
    video.addEventListener('durationchange', updateTime);
    document.getElementById('controls').hidden = false;
    status.textContent = 'Έτοιμο για αναπαραγωγή.';
  </script>
</body>
</html>
