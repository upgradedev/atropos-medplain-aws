<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc">
<title id="title">A transactional outbox connects the console to governed Strands execution</title>
<desc id="desc">Architecture illustration of the existing Atropos MedPlain source db0a25ad: an anonymous React console uses FastAPI on an AWS Lambda Function URL. DynamoDB commits the case and outbox atomically. A DynamoDB Streams relay Lambda sends selectors to SQS. A fenced worker Lambda executes the Strands Graph with Amazon Bedrock. Actual Agents: DischargeEvidenceIndexerAgent, CrossDocumentClarificationPlannerAgent, ClarificationCardPublisherAgent. Configured models are Nova Micro, Nova Pro, Nova Micro respectively. CareflowTeachbackAssessmentAgent uses the same bounded delivery path and configured Nova Pro. Verified artifacts and receipts require human release. Repeated delivery does not imply exactly-once inference.</desc>
