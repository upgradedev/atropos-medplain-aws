<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">From a discharge question to a reviewed next step</title>
<desc id="desc">Workflow illustration of Atropos MedPlain source db0a25ad. Actual Strands agent names: DischargeEvidenceIndexerAgent, CrossDocumentClarificationPlannerAgent and ClarificationCardPublisherAgent. Custom tools and lifecycle validation govern their card. CareflowTeachbackAssessmentAgent supplies a separate provisional response assessment. Synthetic roles do not authenticate hospital staff and no clinical outcome is claimed.</desc>
<defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#17352f" stop-opacity=".65"/><stop offset="1" stop-color="#10151d" stop-opacity="0"/></linearGradient><marker id="arrow-mint" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#7ce4c5" stroke-width="2"/></marker><marker id="arrow-amber" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#f1c27b" stroke-width="2"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1600" height="1160" fill="#10151d"/><rect width="1600" height="210" fill="url(#wash)"/>
<path d="M64 45 L83 38 L102 45 V62 Q102 76 83 86 Q64 76 64 62 Z" fill="none" stroke="#7ce4c5" stroke-width="3"/><path d="M74 59 L81 66 L93 52" fill="none" stroke="#7ce4c5" stroke-width="3"/>
<text x="122" y="68" font-size="26" fill="#7ce4c5" font-weight="700" text-anchor="start">ATROPOS MEDPLAIN</text>
<text x="1536" y="67" font-size="24" fill="#94a3b7" font-weight="400" text-anchor="end">WORKFLOW ILLUSTRATION</text>
<text x="64" y="133" font-size="49" fill="#e9eef5" font-weight="700" text-anchor="start">A question needs an accepted next step.</text>
<text x="64" y="181" font-size="27" fill="#94a3b7" font-weight="400" text-anchor="start">Keep the source, the responsibility and the patient response inspectable.</text>
<path d="M518 385 H564" fill="none" stroke="#7ce4c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
<path d="M1030 385 H1076" fill="none" stroke="#7ce4c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
<path d="M1312 556 V653" fill="none" stroke="#7ce4c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
<path d="M1082 830 H1036" fill="none" stroke="#7ce4c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
<path d="M570 830 H524" fill="none" stroke="#7ce4c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
<rect x="64" y="220" width="448" height="330" rx="24" fill="#171e28" stroke="#2b3645" stroke-width="2"/>
<text x="92" y="264" font-size="24" fill="#7ce4c5" font-weight="700" text-anchor="start">01  ORIGINAL EVIDENCE</text>
<text x="92" y="311" font-size="31" fill="#e9eef5" font-weight="700" text-anchor="start">Keep the originals</text>
<text x="92" y="358" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Discharge + home medicines</text>
<text x="92" y="397" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Caregiver concerns</text>
<text x="92" y="436" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Exact quotes + source identity</text>
<rect x="88" y="470" width="400" height="54" rx="14" fill="#202a37" stroke="#2b3645" stroke-width="2"/>
<text x="106" y="505" font-size="24" fill="#7ce4c5" font-weight="700" text-anchor="start">Missing facts stay missing</text>
<rect x="576" y="220" width="448" height="330" rx="24" fill="#171e28" stroke="#2b3645" stroke-width="2"/>
<text x="604" y="264" font-size="24" fill="#7ce4c5" font-weight="700" text-anchor="start">02  STRANDS + STRICT GATE</text>
<text x="604" y="311" font-size="31" fill="#e9eef5" font-weight="700" text-anchor="start">Propose, then verify</text>
<text x="604" y="358" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Index sources → plan → publish</text>
<text x="604" y="397" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">3 Agents + fresh custom tools</text>
<text x="604" y="436" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Typed output + lifecycle hook</text>
<rect x="600" y="470" width="400" height="54" rx="14" fill="#202a37" stroke="#2b3645" stroke-width="2"/>
<text x="618" y="505" font-size="24" fill="#f1c27b" font-weight="700" text-anchor="start">Fail: repair or withhold</text>
<rect x="1088" y="220" width="448" height="330" rx="24" fill="#171e28" stroke="#2b3645" stroke-width="2"/>
<text x="1116" y="264" font-size="24" fill="#7ce4c5" font-weight="700" text-anchor="start">03  ACCOUNTABILITY</text>
<text x="1116" y="311" font-size="31" fill="#e9eef5" font-weight="700" text-anchor="start">Assign. Accept. Reply.</text>
<text x="1116" y="358" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Reviewer assigns a question.</text>
<text x="1116" y="397" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Selected demo actor accepts.</text>
<text x="1116" y="436" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Reply binds to original sources.</text>
<rect x="1112" y="470" width="400" height="54" rx="14" fill="#202a37" stroke="#2b3645" stroke-width="2"/>
<text x="1130" y="505" font-size="24" fill="#f1c27b" font-weight="700" text-anchor="start">No treatment authority</text>
<rect x="1088" y="665" width="448" height="330" rx="24" fill="#171e28" stroke="#2b3645" stroke-width="2"/>
<text x="1116" y="709" font-size="24" fill="#7ce4c5" font-weight="700" text-anchor="start">04  CHILD SOURCE + RELEASE</text>
<text x="1116" y="756" font-size="31" fill="#e9eef5" font-weight="700" text-anchor="start">Verify a new revision</text>
<text x="1116" y="803" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Operator submits new source.</text>
<text x="1116" y="842" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Reviewer links the exact child.</text>
<text x="1116" y="881" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Human release applies to child.</text>
<rect x="1112" y="915" width="400" height="54" rx="14" fill="#202a37" stroke="#2b3645" stroke-width="2"/>
<text x="1130" y="950" font-size="24" fill="#7ce4c5" font-weight="700" text-anchor="start">Original parent stays intact</text>
<rect x="576" y="665" width="448" height="330" rx="24" fill="#171e28" stroke="#2b3645" stroke-width="2"/>
<text x="604" y="709" font-size="24" fill="#7ce4c5" font-weight="700" text-anchor="start">05  PATIENT&#x27;S OWN WORDS</text>
<text x="604" y="756" font-size="31" fill="#e9eef5" font-weight="700" text-anchor="start">Retain the actual response</text>
<text x="604" y="803" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Read-only released card.</text>
<text x="604" y="842" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Separate private response link.</text>
<text x="604" y="881" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Keep each answer as an attempt.</text>
<rect x="600" y="915" width="400" height="54" rx="14" fill="#202a37" stroke="#2b3645" stroke-width="2"/>
<text x="618" y="950" font-size="24" fill="#7ce4c5" font-weight="700" text-anchor="start">Example: “Yes, I understand.”</text>
<rect x="64" y="665" width="448" height="330" rx="24" fill="#171e28" stroke="#2b3645" stroke-width="2"/>
<text x="92" y="709" font-size="24" fill="#7ce4c5" font-weight="700" text-anchor="start">06  PROVISIONAL REVIEW</text>
<text x="92" y="756" font-size="31" fill="#e9eef5" font-weight="700" text-anchor="start">Assess, then follow up</text>
<text x="92" y="803" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Strands checks source points.</text>
<text x="92" y="842" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Reviewer chooses follow-up.</text>
<text x="92" y="881" font-size="25" fill="#94a3b7" font-weight="400" text-anchor="start">Recheck stays a new attempt.</text>
<rect x="88" y="915" width="400" height="54" rx="14" fill="#202a37" stroke="#2b3645" stroke-width="2"/>
<text x="106" y="950" font-size="24" fill="#f1c27b" font-weight="700" text-anchor="start">No comprehension certificate</text>
<path d="M288 1004 V1042 H800 V1007" fill="none" stroke="#7ce4c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)" stroke-dasharray="9 10"/>
<text x="541" y="1080" font-size="24" fill="#7ce4c5" font-weight="400" text-anchor="middle">Follow-up requests another response</text>
<text x="64" y="1130" font-size="24" fill="#94a3b7" font-weight="400" text-anchor="start">Illustration · Synthetic roles · Source db0a25ad · No measured clinical outcome</text>
</g></svg>
