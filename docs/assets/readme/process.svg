<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 485" role="img" aria-labelledby="title desc">
<title id="title">Follow one question through five stages</title><desc id="desc">Inspect sources, clarify the question, accept the task, verify a separate revision, then review and recheck the patient's own words. Original evidence is retained and a reviewer controls publication.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081722"/><stop offset="1" stop-color="#102a32"/></linearGradient><linearGradient id="line"><stop stop-color="#80dfc3"/><stop offset="1" stop-color="#719fff"/></linearGradient></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#edf5f8}.eyebrow{fill:#80dfc3;font-size:18px;font-weight:700;letter-spacing:2px}.title{font-size:44px;font-weight:700}.body{font-size:23px;fill:#b9ced9}.small{font-size:18px;fill:#a4becd}.label{font-size:19px;fill:#80dfc3;font-weight:700}.card{fill:#132631;stroke:#3a5360;stroke-width:1.5}.name{font-size:26px;font-weight:700}.muted{fill:#9cb4c4}</style><rect width="1440" height="485" rx="24" fill="url(#bg)"/>
<text x="48" y="56" class="eyebrow">THE SAME CASE, FROM SOURCE TO RECHECK</text>
<text x="48" y="112" class="title">Every handoff leaves a record.</text>
<rect x="48" y="162" width="256" height="220" rx="16" class="card"/><text x="66" y="200" class="label">1  Inspect</text><text x="66" y="249" style="font-size:24px;font-weight:700">Original sources</text><text x="66" y="291" class="small">Pending result + concern</text><text x="66" y="344" style="font-size:16px;fill:#a4becd">Read-only preview</text><path d="M308 271h16m-6-6 6 6-6 6" fill="none" stroke="#80dfc3" stroke-width="2"/><rect x="328" y="162" width="256" height="220" rx="16" class="card"/><text x="346" y="200" class="label">2  Clarify</text><text x="346" y="249" style="font-size:24px;font-weight:700">Source-cited card</text><text x="346" y="291" class="small">A question with witnesses</text><text x="346" y="344" style="font-size:16px;fill:#a4becd">Verified facts, no regimen</text><path d="M588 271h16m-6-6 6 6-6 6" fill="none" stroke="#80dfc3" stroke-width="2"/><rect x="608" y="162" width="256" height="220" rx="16" class="card"/><text x="626" y="200" class="label">3  Accept</text><text x="626" y="249" style="font-size:24px;font-weight:700">Named demo actor</text><text x="626" y="291" class="small">Assign, select, accept</text><text x="626" y="344" style="font-size:16px;fill:#a4becd">Role and actor are separate</text><path d="M868 271h16m-6-6 6 6-6 6" fill="none" stroke="#80dfc3" stroke-width="2"/><rect x="888" y="162" width="256" height="220" rx="16" class="card"/><text x="906" y="200" class="label">4  Reverify</text><text x="906" y="249" style="font-size:24px;font-weight:700">A separate child</text><text x="906" y="291" class="small">Verify, link, review, release</text><text x="906" y="344" style="font-size:16px;fill:#a4becd">Parent evidence stays intact</text><path d="M1148 271h16m-6-6 6 6-6 6" fill="none" stroke="#80dfc3" stroke-width="2"/><rect x="1168" y="162" width="256" height="220" rx="16" class="card"/><text x="1186" y="200" class="label">5  Recheck</text><text x="1186" y="249" style="font-size:24px;font-weight:700">Patient own words</text><text x="1186" y="291" class="small">Assess, review, follow up</text><text x="1186" y="344" style="font-size:16px;fill:#a4becd">Assessment is provisional</text><text x="48" y="437" class="small">Synthetic workflow illustration. A source-bound answer is not a prescription; a reviewed response does not certify comprehension.</text></svg>