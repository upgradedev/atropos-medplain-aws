[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atropos-medplain"
version = "0.1.0"
description = "Strands multi-agent discharge explanations with a deterministic publication gate"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["strands-agents==1.53.0", "boto3>=1.40,<2", "fastapi>=0.115,<1", "pydantic>=2.11,<3", "uvicorn>=0.34,<1", "mangum>=0.19,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medplain = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
