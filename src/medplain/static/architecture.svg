<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Atropos MedPlain architecture</title>
  <desc id="desc">An anonymous browser calls FastAPI on AWS Lambda. A real Strands Graph runs parser, verifier and explainer Agents with Bedrock. The lifecycle gate sends mismatches through correction and publishes verified text with a hash-chain receipt.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#173f3b" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="730" rx="24" fill="#f5f3eb"/>
  <g font-family="Arial,sans-serif" fill="#173f3b">
    <text x="50" y="60" font-size="30" font-weight="700">Atropos MedPlain</text>
    <text x="50" y="91" font-size="18">A Strands Graph owns execution. A deterministic gate owns publication.</text>
    <rect x="50" y="125" width="1100" height="520" rx="18" fill="#fff" stroke="#b4c9bd"/>
    <text x="76" y="159" font-size="15" font-weight="700">AWS LAMBDA FUNCTION URL + FASTAPI | REQUEST-SCOPED SESSION</text>
    <g fill="#e5f2e9" stroke="#8cafa0" stroke-width="1.5">
      <rect x="80" y="202" width="215" height="86" rx="12"/>
      <rect x="365" y="202" width="215" height="86" rx="12"/>
      <rect x="650" y="202" width="215" height="86" rx="12"/>
      <rect x="935" y="202" width="185" height="86" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="19" font-weight="700">
      <text x="187" y="236">Anonymous browser</text><text x="472" y="236">Parser Agent</text>
      <text x="757" y="236">Verifier Agent</text><text x="1027" y="236">Explainer Agent</text>
    </g>
    <g text-anchor="middle" font-size="14">
      <text x="187" y="263">Fixed synthetic packet selector</text><text x="472" y="263">Source + FHIR + lab ranges</text>
      <text x="757" y="263">Dose parity + curated pairs</text><text x="1027" y="263">Typed grounded explanation</text>
    </g>
    <g fill="none" stroke="#173f3b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M295 245H361"/><path d="M580 245H646"/><path d="M865 245H931"/>
      <path d="M1027 288V347"/><path d="M897 400H761V292"/>
      <path d="M1027 449V502"/>
    </g>
    <rect x="897" y="351" width="223" height="98" rx="12" fill="#fff0d8" stroke="#b08538" stroke-width="2"/>
    <text x="1008" y="384" font-size="19" font-weight="700" text-anchor="middle">Atropos lifecycle gate</text>
    <text x="1008" y="413" font-size="15" text-anchor="middle">Exact facts + constrained text</text>
    <text x="775" y="386" font-size="14">Mismatch: refuse</text><text x="775" y="422" font-size="14">Bounded correction cycle</text>
    <rect x="896" y="507" width="224" height="98" rx="12" fill="#173f3b"/>
    <text x="1008" y="541" font-size="19" font-weight="700" text-anchor="middle" fill="#fff">Publish verified artifact</text>
    <text x="1008" y="570" font-size="15" text-anchor="middle" fill="#d2ecda">Text + hash-chain receipts</text>
    <rect x="365" y="500" width="380" height="105" rx="12" fill="#eff2f6" stroke="#aab8c5"/>
    <text x="555" y="535" text-anchor="middle" font-size="20" font-weight="700">Amazon Bedrock Nova Micro</text>
    <text x="555" y="566" text-anchor="middle" font-size="15">All three Agents: tools + Pydantic outputs</text>
    <path d="M555 500V329H1027" fill="none" stroke="#aab8c5" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="80" y="387" font-size="17" font-weight="700">No patient data upload or persistent health store</text>
    <text x="80" y="420" font-size="15">Source profile: MedicationRequest, Observation and canonical narrative</text>
    <text x="80" y="449" font-size="15">CI: real Strands orchestration with an offline fixture inference adapter</text>
    <text x="50" y="684" font-size="16">Synthetic engineering demonstration. Source fidelity does not establish clinical correctness.</text>
  </g>
</svg>
